<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --primary:#4F9D93;
    --primary-dark:#356E67;
    --primary-light:#9AD7D3;
    --primary-tint:#E9F3F2;
    --brass:#B08D57;
    --brass-tint:#F5EEE1;
    --secondary:#16212B;
    --text:#33424E;
    --text-light:#69747E;
    --background:#FAF8F4;
    --white:#FFFFFF;
    --border:#E7E2D8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    width:1080px;
    height:1350px;
    background:var(--background);
    font-family:'Inter',sans-serif;
    color:var(--text);
    overflow:hidden;
  }

  .slide{
    width:1080px;
    height:1350px;
    position:relative;
    display:flex;
    flex-direction:column;
    padding:80px 90px;
  }

  /* Decorative corner texture shared by every slide */
  .slide::before{
    content:"";
    position:absolute;
    top:0; right:0;
    width:340px; height:340px;
    background:var(--primary-tint);
    border-radius:0 0 0 100%;
    z-index:0;
  }
  .slide::after{
    content:"";
    position:absolute;
    bottom:0; left:0;
    width:220px; height:220px;
    background:var(--brass-tint);
    border-radius:0 100% 0 0;
    z-index:0;
  }

  .eyebrow{
    position:relative; z-index:1;
    display:flex; align-items:center; gap:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:22px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--primary-dark);
    margin-bottom:48px;
  }
  .eyebrow .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--brass);
  }
  .eyebrow .counter{
    margin-left:auto;
    color:var(--text-light);
  }

  .content{
    position:relative; z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:64px;
    line-height:1.15;
    color:var(--secondary);
    margin-bottom:28px;
  }

  .subheading{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:32px;
    line-height:1.5;
    color:var(--text-light);
    max-width:820px;
  }

  /* Content ("tip") slide */
  .slide.content-slide h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:52px;
    line-height:1.25;
    color:var(--secondary);
    margin-bottom:32px;
  }
  .slide.content-slide .body-text{
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:34px;
    line-height:1.55;
    color:var(--text);
    max-width:840px;
  }
  .slide-number-badge{
    position:relative; z-index:1;
    width:84px; height:84px;
    border-radius:50%;
    background:var(--primary);
    color:var(--white);
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:36px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:44px;
  }

  /* Cover slide */
  .slide.cover-slide .content{ justify-content:flex-end; padding-bottom:60px; }
  .slide.cover-slide h1{ font-size:76px; }
  .brand-mark{
    position:relative; z-index:1;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    color:var(--primary-dark);
  }

  /* CTA / closing slide */
  .slide.cta-slide{ background:var(--primary-dark); }
  .slide.cta-slide::before{ background:rgba(255,255,255,.06); }
  .slide.cta-slide::after{ background:rgba(176,141,87,.18); }
  .slide.cta-slide .eyebrow{ color:var(--primary-light); }
  .slide.cta-slide h1{ color:var(--white); font-size:58px; }
  .slide.cta-slide .subheading{ color:rgba(255,255,255,.82); }
  .slide.cta-slide .cta-button{
    position:relative; z-index:1;
    margin-top:48px;
    display:inline-flex;
    align-items:center;
    gap:12px;
    background:var(--brass);
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:28px;
    padding:22px 40px;
    border-radius:14px;
    width:fit-content;
  }
  .slide.cta-slide .brand-mark{ color:var(--primary-light); }

  .footer-bar{
    position:relative; z-index:1;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
</style>
</head>
<body>
  <div class="slide {{SLIDE_CLASS}}">
    <div class="eyebrow">
      <span class="dot"></span>
      <span>{{BRAND_LABEL}}</span>
      <span class="counter">{{SLIDE_NUM}} / {{TOTAL}}</span>
    </div>

    <div class="content">
      {{SLIDE_NUMBER_BADGE}}
      {{HEADING_MARKUP}}
      {{BODY_MARKUP}}
      {{CTA_BUTTON_MARKUP}}
    </div>

    <div class="footer-bar">
      <span class="brand-mark">{{BRAND_MARK}}</span>
    </div>
  </div>
</body>
</html>
